name: Actualizar programa desde Notion

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # botón "Run workflow" manual en GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar script de actualización
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/actualizar_datos.py

      - name: Commitear data.json si cambió
        run: |
          git config user.name "sidll-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Actualizar programa desde Notion"
            git push
          else
            echo "Sin cambios en data.json"
          fi
