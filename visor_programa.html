<head>

<style>
  :root{
    --bg:#ffffff; --surface:#f7f9fc; --surface-2:#eef2f9; --border:#e0e6f0;
    --text:#161a30; --text-dim:#5c6273;
    --navy:#12184a; --blue:#1557b7; --sky:#4a90c4; --crimson:#b3192b;
    --warn-bg:#fff3d6; --warn-text:#8a5a00; --warn-border:#e8c766;
    --chip-bg:#eef2f9;
    --shadow: 0 1px 2px rgba(18,24,74,.05), 0 4px 14px rgba(18,24,74,.06);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:20px 16px 80px;}

  header.top{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--border);
  }
  header.top img.logo{height:64px; width:auto; flex-shrink:0;}
  header.top .heading{flex:1; min-width:220px;}
  h1{font-size:1.3rem; margin:0; color:var(--navy); letter-spacing:-.01em;}
  .stats{display:flex; gap:14px; font-size:.8rem; color:var(--text-dim); flex-wrap:wrap;}
  .stats b{color:var(--navy); font-weight:700;}

  .update-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  button#refresh{
    display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px; border:1px solid var(--blue);
    background:var(--blue); color:#fff; font-size:.82rem; font-weight:650; cursor:pointer; font-family:inherit;
  }
  button#refresh:hover{background:#0f4494;}
  button#refresh:disabled{opacity:.6; cursor:default;}
  button#refresh svg{width:14px; height:14px;}
  button#refresh.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
  #update-status{font-size:.76rem; color:var(--text-dim);}
  #update-status.ok{color:var(--blue);}
  #update-status.err{color:var(--crimson);}

  .tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border);}
  .tab{
    padding:9px 16px; font-size:.85rem; font-weight:600; color:var(--text-dim);
    cursor:pointer; border-bottom:2px solid transparent; user-select:none;
  }
  .tab.active{color:var(--blue); border-color:var(--blue);}

  .controls{
    display:grid; grid-template-columns: 1.4fr repeat(5, 1fr); gap:8px; margin-bottom:16px;
  }
  @media (max-width: 900px){ .controls{grid-template-columns: 1fr 1fr 1fr;} }
  @media (max-width: 560px){ .controls{grid-template-columns: 1fr 1fr;} }
  input[type=search], select{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:.85rem; font-family:inherit;
  }
  input[type=search]:focus, select:focus{outline:2px solid var(--sky); outline-offset:1px;}

  .day-group{margin-bottom:26px;}
  .day-head{
    display:flex; align-items:center; gap:10px; margin:0 0 10px; position:sticky; top:0;
    background:var(--bg); padding:8px 0; z-index:2;
  }
  .day-head h2{font-size:1.02rem; margin:0; color:var(--navy);}
  .day-head .count{font-size:.75rem; color:var(--text-dim); background:var(--chip-bg); padding:2px 9px; border-radius:20px;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow);
    display:grid; grid-template-columns: 92px 1fr auto; gap:12px; align-items:start;
  }
  @media (max-width:600px){ .card{grid-template-columns: 1fr; gap:6px;} }
  .time{font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; color:var(--blue); white-space:nowrap;}
  .time small{display:block; font-weight:500; color:var(--text-dim); font-size:.68rem;}
  .body .title{font-size:.9rem; font-weight:600; line-height:1.35; margin:0 0 4px; color:var(--text);}
  .body .meta{font-size:.76rem; color:var(--text-dim); display:flex; flex-wrap:wrap; gap:6px 10px;}
  .body .meta .code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--navy);}
  .tags{display:flex; flex-direction:column; align-items:flex-end; gap:5px; text-align:right;}
  .pill{
    font-size:.68rem; font-weight:650; padding:3px 9px; border-radius:20px; background:var(--chip-bg);
    color:var(--text-dim); white-space:nowrap;
  }
  .pill.aula{color:var(--crimson); background:#fbe9ec;}
  .pill.borrador{background:var(--warn-bg); color:var(--warn-text); border:1px solid var(--warn-border);}

  .sesion-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .sesion-card .title{font-weight:650; font-size:.88rem; margin:0 0 4px; color:var(--text);}
  .sesion-card .meta{font-size:.76rem; color:var(--text-dim); display:flex; flex-wrap:wrap; gap:6px 10px;}

  .empty{padding:40px 0; text-align:center; color:var(--text-dim); font-size:.85rem;}
</style>
</head>

  return [...list].sort((a,b)=>{
    const [aIni,aFin] = a.split('–');
    const [bIni,bFin] = b.split('–');
    return timeToMinutes(aIni) - timeToMinutes(bIni) || timeToMinutes(aFin) - timeToMinutes(bFin);
  });
}

const SELECT_IDS = { dia:'f-dia', horario:'f-horario', aula:'f-aula', eje:'f-eje', tipo:'f-tipo' };
const defaultOptionHTML = {};
Object.values(SELECT_IDS).forEach(id=>{
  defaultOptionHTML[id] = document.getElementById(id).innerHTML;
});

function fillSelect(field, values){
  const id = SELECT_IDS[field];
  const sel = document.getElementById(id);
  sel.innerHTML = defaultOptionHTML[id];
  values.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
  if(values.includes(state[field])){
    sel.value = state[field];
  } else {
    state[field] = '';
    sel.value = '';
  }
}

function applyData(data){
  trabajos = data.trabajos || [];
  sesiones = data.sesiones || [];
  meta.generado = data.generado || null;

  refreshFilterOptions();

  document.getElementById('stats').innerHTML =
    `<span><b>${trabajos.filter(t=>t.estado==='Programado').length}</b> programadas</span>` +
    `<span><b>${trabajos.filter(t=>t.estado!=='Programado').length}</b> borrador</span>` +
    `<span><b>${sesiones.length}</b> sesiones</span>`;

  render();
}

function matches(t, exclude){
  if(exclude!=='dia' && state.dia && t.dia !== state.dia) return false;
  if(exclude!=='horario' && state.horario && horarioDeTrabajo(t) !== state.horario) return false;
  if(exclude!=='aula' && state.aula && t.aula !== state.aula) return false;
  if(exclude!=='eje' && state.eje && t.eje !== state.eje) return false;
  if(exclude!=='tipo' && state.tipo && t.tipo !== state.tipo) return false;
  if(state.q){
    const hay = norm(t.titulo)+' '+norm(t.autor)+' '+norm(t.codigo)+' '+norm(t.aula)+' '+norm(t.eje);
    if(!hay.includes(norm(state.q))) return false;
  }
  return true;
}

function sesionMatches(s, exclude){
  if(exclude!=='dia' && state.dia && s.dia !== state.dia) return false;
  if(exclude!=='horario' && state.horario && horarioDeSesion(s) !== state.horario) return false;
  if(exclude!=='aula' && state.aula && s.aula !== state.aula) return false;
  if(exclude!=='eje' && state.eje && s.eje !== state.eje) return false;
  if(exclude!=='tipo' && state.tipo && s.tipo !== state.tipo) return false;
  if(state.q){
    const hay = norm(s.sesion)+' '+norm(s.codigo)+' '+norm(s.aula);
    if(!hay.includes(norm(state.q))) return false;
  }
  return true;
}

function computeOptions(field, dataset, matchFn){
  const raw = dataset
    .filter(item => matchFn(item, field))
    .map(item => field === 'horario' ? getHorario(item) : item[field])
    .filter(Boolean);
  const set = [...new Set(raw)];
  if(field === 'dia') return dias.filter(d => set.includes(d));
  if(field === 'horario') return sortHorarios(set);
  return set.sort((a,b) => a.localeCompare(b,'es'));
}

function refreshFilterOptions(){
  const dataset = state.tab === 'programa' ? trabajos : sesiones;
  const matchFn = state.tab === 'programa' ? matches : sesionMatches;
  ['dia','horario','aula','eje','tipo'].forEach(field=>{
    fillSelect(field, computeOptions(field, dataset, matchFn));
  });
}

function renderPrograma(){
  const filtered = trabajos.filter(matches);
  const el = document.getElementById('view-programa');
  el.innerHTML = '';
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

  const byDay = {};
  filtered.forEach(t=>{
    const d = t.dia || 'Sin programar';
    (byDay[d] = byDay[d] || []).push(t);
  });

  const order = [...dias, 'Sin programar'];
  order.forEach(d=>{
    const items = byDay[d];
    if(!items || !items.length) return;
    const group = document.createElement('div');
    group.className = 'day-group';
    group.innerHTML = `<div class="day-head"><h2>${d}</h2><span class="count">${items.length}</span></div>`;
    items.forEach(t=>{
      const card = document.createElement('div');
      card.className = 'card';
      const borrador = t.estado !== 'Programado';
      card.innerHTML = `
        <div class="time">${t.inicio || '—'}<small>${t.fin ? '– '+t.fin : ''}</small></div>
        <div class="body">
          <p class="title">${t.titulo}</p>
          <div class="meta">
            <span>${t.autor || ''}</span>
          </div>
        </div>
        <div class="tags">
          ${t.aula ? `<span class="pill aula">${t.aula}</span>` : ''}
          <span class="pill">${t.tipo}</span>
          ${borrador ? `<span class="pill borrador">Propuesta / borrador</span>` : ''}
        </div>`;
      group.appendChild(card);
    });
    el.appendChild(group);
  });
}

function renderSesiones(){
  const filtered = sesiones.filter(sesionMatches);
  const el = document.getElementById('view-sesiones');
  el.innerHTML = '';
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

  const byDay = {};
  filtered.forEach(s=>{
    const d = s.dia || 'Sin día';
    (byDay[d] = byDay[d] || []).push(s);
  });

  dias.forEach(d=>{
    const items = byDay[d];
    if(!items || !items.length) return;
    const group = document.createElement('div');
    group.className = 'day-group';
    group.innerHTML = `<div class="day-head"><h2>${d}</h2><span class="count">${items.length}</span></div>`;
    items.forEach(s=>{
      const card = document.createElement('div');
      card.className = 'sesion-card';
      card.innerHTML = `
        <p class="title">${s.inicio}–${s.fin} · ${s.sesion}</p>
        <div class="meta">
          <span class="code">${s.codigo}</span>
          <span>${s.aula}</span>
          <span>${s.tipo}</span>
        </div>`;
      group.appendChild(card);
    });
    el.appendChild(group);
  });
}

function render(){
  document.getElementById('view-programa').style.display = state.tab === 'programa' ? '' : 'none';
  document.getElementById('view-sesiones').style.display = state.tab === 'sesiones' ? '' : 'none';
  if(state.tab === 'programa') renderPrograma(); else renderSesiones();
}

function onFilterChange(field, value){
  state[field] = value;
  refreshFilterOptions();
  render();
}

document.getElementById('q').addEventListener('input', e=>{ state.q = e.target.value; refreshFilterOptions(); render(); });
document.getElementById('f-dia').addEventListener('change', e=>onFilterChange('dia', e.target.value));
document.getElementById('f-horario').addEventListener('change', e=>onFilterChange('horario', e.target.value));
document.getElementById('f-aula').addEventListener('change', e=>onFilterChange('aula', e.target.value));
document.getElementById('f-eje').addEventListener('change', e=>onFilterChange('eje', e.target.value));
document.getElementById('f-tipo').addEventListener('change', e=>onFilterChange('tipo', e.target.value));
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    state.tab = tab.dataset.tab;
    refreshFilterOptions();
    render();
  });
});

async function loadData(isRefresh){
  const btn = document.getElementById('refresh');
  const status = document.getElementById('update-status');
  btn.classList.add('spin');
  btn.disabled = true;
  try{
    const res = await fetch('data.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    applyData(data);
    status.textContent = isRefresh ? 'Actualizado ✓' : '';
    status.className = 'ok';
  }catch(err){
    if(!isRefresh){
      // primera carga sin servidor (file://): usar copia local incluida en el HTML
      const fallback = JSON.parse(document.getElementById('fallback-data').textContent);
      applyData(fallback);
      status.textContent = '';
      status.className = '';
    } else {
      status.textContent = 'No se pudo conectar con data.json — se mantiene la copia actual.';
      status.className = 'err';
    }
  } finally {
    btn.classList.remove('spin');
    btn.disabled = false;
  }
}

document.getElementById('refresh').addEventListener('click', ()=>loadData(true));
loadData(false);
</script>
